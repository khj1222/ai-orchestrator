# config.toml 로 복사해서 채운다. config.toml 은 버전 관리에 포함하지 않는다.
# 경로의 버전·해시 폴더는 앱 업데이트로 바뀔 수 있다. 실행 시점에 확인한다.
#
# 주의: 데스크톱 앱이 MSIX 패키지로 설치된 경우, 그 앱이 띄운 프로세스가 보는 AppData 경로는
# 패키지 안으로 가상화된 것이라 일반 셸에서는 존재하지 않는다. 여기 적는 경로는 반드시
# 실행기가 실제로 돌아갈 셸에서 확인한 것이어야 한다.

[paths]
# codex.exe 절대 경로 (Codex 앱 번들). 가상화 대상이 아니다.
codex = 'C:\Users\<user>\AppData\Local\OpenAI\Codex\bin\<hash>\codex.exe'
# claude.exe 절대 경로. 독립 설치(irm https://claude.ai/install.ps1 | iex)를 쓴다.
# 데스크톱 앱 번들(%APPDATA%\Claude\claude-code\...)은 패키지 안에 있어 쓰지 않는다.
claude = 'C:\Users\<user>\.local\bin\claude.exe'
# Codex 세션 로그 폴더 (rate_limits 스냅샷을 읽는 위치)
codex_sessions = 'C:\Users\<user>\.codex\sessions'

# route_id 별 실행 설정. 작업 명세의 route_id 가 이 이름을 가리킨다.
# 모델은 전체 ID 로 적는다. 별칭은 가리키는 대상이 바뀔 수 있다.

[routes.codex-default]
tool = "codex"
# 2026-09-12 결정: 이 PC의 ~/.codex/config.toml 전역 기본값과 동일하게 맞춘다.
# gpt-6-astra 는 2026-09 기준 Codex 의 최상위 모델(Codex CLI 0.153.0+ 필요, 이 PC 0.154.0-alpha.6.2로 충족).
# reasoning effort 표기는 Light/Medium/High/Extra High 네 단계이나, CLI 설정 문자열은
# 이 PC에서 실제로 동작 중인 "high" 로 둔다("extra-high" 등 상위 단계의 정확한 문자열은 미확인).
model = "gpt-6-astra"
model_reasoning_effort = "high"
sandbox = "workspace-write"
# 2026-09-12 결정 (W3 검토 U1): ephemeral 비활성화. rate_limits 조회를 유지하는 대신
# ~/.codex/sessions/ 롤아웃이 계속 쌓이는 것을 감수한다(2026-09-12 기준 813개·1.96GB).
ephemeral = false

[routes.claude-implement]
tool = "claude"
model = "claude-opus-5"
effort = "high"
permission_mode = "acceptEdits"

[routes.claude-review]
tool = "claude"
model = "claude-fable-5-1"
effort = "xhigh"
permission_mode = "plan"

[limits]
# 작업당 총 시도 횟수 (최초 1회 + 수정 1회)
max_attempts_total = 2
# 통합 후 수정 순환 허용 횟수 (W0 에서 확정)
integration_fix_cycles = 1
# 한 시도의 벽시계 한도 (초). 2026-09-12 결정: 1시간. W1·W3처럼 짧은 S 크기 작업엔
# 여유롭고, xhigh effort 검토나 M 크기 구현 작업까지 커버하기 위한 값이다.
timeout_seconds = 3600
# 유료 API 경로 사용 여부. 첫 버전은 비활성화.
paid_api_allowed = false

[environment]
# 작업자 프로세스 환경에서 제거할 변수. 구독 경로로 실행했다는 기록을 사실로 만들기 위함.
strip_env = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "CODEX_API_KEY"]
# 작업자 프로세스에 추가할 변수.
extra_env = { PYTHONUTF8 = "1" }
