# config.toml 로 복사해서 채운다. config.toml 은 버전 관리에 포함하지 않는다.
# 경로의 버전·해시 폴더는 앱 업데이트로 바뀔 수 있다. 실행 시점에 확인한다.

[paths]
# codex.exe 절대 경로 (Codex 앱 번들)
codex = 'C:\Users\<user>\AppData\Local\OpenAI\Codex\bin\<hash>\codex.exe'
# claude.exe 절대 경로 (Claude 데스크톱 앱 번들)
claude = 'C:\Users\<user>\AppData\Roaming\Claude\claude-code\<version>\claude.exe'
# Codex 세션 로그 폴더 (rate_limits 스냅샷을 읽는 위치)
codex_sessions = 'C:\Users\<user>\.codex\sessions'

# route_id 별 실행 설정. 작업 명세의 route_id 가 이 이름을 가리킨다.
# 모델은 전체 ID 로 적는다. 별칭은 가리키는 대상이 바뀔 수 있다.

[routes.codex-default]
tool = "codex"
model = "TO_BE_SELECTED"
sandbox = "workspace-write"

[routes.claude-implement]
tool = "claude"
model = "claude-opus-5"
effort = "high"
permission_mode = "acceptEdits"

[routes.claude-review]
tool = "claude"
model = "claude-fable-5-1"
effort = "xhigh"
permission_mode = "plan"

[limits]
# 작업당 총 시도 횟수 (최초 1회 + 수정 1회)
max_attempts_total = 2
# 통합 후 수정 순환 허용 횟수 (W0 에서 확정)
integration_fix_cycles = 1
# 한 시도의 벽시계 한도 (초). 실행 전 반드시 지정한다.
timeout_seconds = "TO_BE_SELECTED"
# 유료 API 경로 사용 여부. 첫 버전은 비활성화.
paid_api_allowed = false

[environment]
# 작업자 프로세스 환경에서 제거할 변수. 구독 경로로 실행했다는 기록을 사실로 만들기 위함.
strip_env = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "CODEX_API_KEY"]
# 작업자 프로세스에 추가할 변수.
extra_env = { PYTHONUTF8 = "1" }
